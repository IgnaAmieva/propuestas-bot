name: Propuestas

on:
  schedule:
    - cron: "17 */2 * * *"  # cada 2 horas (minuto 17: GitHub se satura en punto)
  workflow_dispatch:         # botón para probarlo a mano
  push:
    branches: [main]         # corre también cada vez que actualizo el bot

jobs:
  buscar:
    runs-on: ubuntu-latest
    environment: TELEGRAM_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
