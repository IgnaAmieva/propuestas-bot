name: Propuestas

on:
  schedule:
    - cron: "17 */2 * * *"  # cada 2 horas (minuto 17: GitHub se satura en punto)
  workflow_dispatch:         # botón para probarlo a mano
  push:
    branches: [main]         # corre también cada vez que actualizo el bot
    paths-ignore: ["enviados.json", "estadisticas.json"]

permissions:
  contents: write            # para guardar la lista de proyectos ya enviados

concurrency:
  group: propuestas
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    environment: TELEGRAM_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar proyectos enviados
        run: |
          git config user.name "propuestas-bot"
          git config user.email "propuestas-bot@users.noreply.github.com"
          git add enviados.json estadisticas.json
          git diff --cached --quiet || (git commit -m "Actualizar enviados" && git pull --rebase && git push)
